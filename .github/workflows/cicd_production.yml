name: Deployment Production To AWS

on:
  push:
    branches:
      - production 

jobs:
  deploy:
    name: Deployment Application
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Execute Remote Deployment via Bastion Host
      uses: appleboy/ssh-action@v1.0.3
      with:
        # Perhatikan kurung kurawal ganda {{ ... }}
        host: ${{ secrets.APP_SERVER_IP }}
        username: ubuntu
        key: ${{ secrets.GIATEXPRESS_KEY }}
        
        # Proxy (Bastion)
        proxy_host: ${{ secrets.BASTION_IP }}
        proxy_username: ec2-user
        proxy_key: ${{ secrets.GIATEXPRESS_KEY }}
        debug: true

        script: |
          # 1. Masuk ke direktori project
          cd /var/www/capstoneproject-retailkopgiat-app || exit
          
          # 2. Amankan folder agar git bisa jalan
          sudo chown -R ubuntu:www-data .
          git config --global --add safe.directory /var/www/capstoneproject-retailkopgiat-app
          
          # 3. Paksa sinkronisasi dengan GitHub (Nuclear Option)
          # Ini akan menarik file deploy.sh yang baru Anda push tanpa error pathspec
          git fetch origin production
          git reset --hard origin/production
          git clean -fd
          
          # 4. Berikan izin eksekusi
          chmod +x deploy.sh
          
          # 5. Jalankan skrip
          ./deploy.sh